name: Deploy Cloudflare Pages

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

jobs:
  deploy:
    strategy:
      matrix:
        app: [mobile, pc]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Detect target
        id: target
        shell: bash
        run: |
          if [ -d "apps/${{ matrix.app }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.target.outputs.exists == 'true'
        with:
          node-version: 24

      - run: npm install
        if: steps.target.outputs.exists == 'true'

      - name: Build
        if: steps.target.outputs.exists == 'true'
        run: npm run build --workspace @prototype/${{ matrix.app }}

      - name: Deploy
        if: steps.target.outputs.exists == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/${{ matrix.app }}/dist --project-name=${{ github.event.repository.name }}-${{ matrix.app }} --branch=${{ github.ref_name }}
