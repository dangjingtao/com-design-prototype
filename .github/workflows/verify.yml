name: Verify Prototype

on:
  pull_request:
  push:
    branches: [main, dev, prod]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Check version contract
        shell: bash
        run: |
          VERSION_FILE="$(tr -d '\r\n' < VERSION)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CONFIG_VERSION="$(node -p "require('./prototype.config.json').versioning.currentVersion")"
          test "$VERSION_FILE" = "$PACKAGE_VERSION"
          test "$VERSION_FILE" = "$CONFIG_VERSION"
      - run: npm run typecheck
      - run: npm run build
      - name: Check Mira CLI syntax
        run: node --check cli/mira.mjs
      - name: Smoke test Mira project generation
        shell: bash
        run: |
          cp cli/mira.mjs /tmp/mira-smoke-cli.mjs
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('/tmp/mira-smoke-cli.mjs')
          text = path.read_text()
          text = text.replace('https://github.com/dangjingtao/com-design-prototype.git', os.environ['GITHUB_WORKSPACE'])
          path.write_text(text)
          PY
          node /tmp/mira-smoke-cli.mjs create prototype mira-smoke --no-install --title="Smoke Prototype" --targets=mobile --deploy=github
          test -f mira-smoke/apps/mobile/package.json
          test ! -d mira-smoke/apps/pc
          test -f mira-smoke/.github/workflows/verify.yml
          test -f mira-smoke/.github/workflows/deploy-github-pages.yml
          test ! -f mira-smoke/.github/workflows/deploy-cloudflare.yml
          test -f mira-smoke/AGENTS.md
          test -f mira-smoke/docs/ai/skills.md
          test -f mira-smoke/docs/ai/skills/daily-report.md
          test -f mira-smoke/docs/reports/daily/README.md
          test -f mira-smoke/docs/governance/version-control.md
          test -f mira-smoke/docs/guide/ai-collaboration-manual.md
          test "$(tr -d '\r\n' < mira-smoke/VERSION)" = "0.1.0"
          grep -q 'Status: `PENDING`' mira-smoke/docs/ai/skills.md
          grep -q 'ai-collaboration-manual.md' mira-smoke/AGENTS.md
          grep -q 'branches: \[dev, prod\]' mira-smoke/.github/workflows/verify.yml
          ! grep -q 'branches: \[main' mira-smoke/.github/workflows/verify.yml
          ! grep -q 'cli/mira.mjs' mira-smoke/.github/workflows/verify.yml
          node - <<'NODE'
          const p = require('./mira-smoke/package.json');
          const c = require('./mira-smoke/prototype.config.json');
          if (p.version !== '0.1.0') process.exit(1);
          if (!p.author.includes('Tomz') || !p.author.includes('Mira')) process.exit(1);
          if (c.versioning.currentVersion !== '0.1.0') process.exit(1);
          if (c.versioning.seedVersion !== '0.3.1') process.exit(1);
          if (!c.targets.mobile || c.targets.pc) process.exit(1);
          if (!c.deployment.githubPages.enabled) process.exit(1);
          if (c.deployment.cloudflare.enabled) process.exit(1);
          if (c.repository.provider !== 'github' || c.repository.url !== null) process.exit(1);
          if (c.workflow.developmentBranch !== 'dev' || c.workflow.productionBranch !== 'prod') process.exit(1);
          if (c.workflow.usesMainForProductWork !== false) process.exit(1);
          if (JSON.stringify(c.workflow.longLivedBranches) !== JSON.stringify(['dev', 'prod'])) process.exit(1);
          if (c.workbench.dailyReport.skill !== 'docs/ai/skills/daily-report.md') process.exit(1);
          NODE
