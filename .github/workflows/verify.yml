name: Verify Prototype

on:
  pull_request:
  push:
    branches: [main, dev, prod]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Check Mira CLI syntax
        run: node --check cli/mira.mjs
      - name: Smoke test Mira project generation
        shell: bash
        run: |
          node cli/mira.mjs create prototype mira-smoke --no-install --title="Smoke Prototype" --targets=mobile --deploy=github
          test -f mira-smoke/apps/mobile/package.json
          test ! -d mira-smoke/apps/pc
          test -f mira-smoke/.github/workflows/deploy-github-pages.yml
          test ! -f mira-smoke/.github/workflows/deploy-cloudflare.yml
          node - <<'NODE'
          const c = require('./mira-smoke/prototype.config.json');
          if (!c.targets.mobile || c.targets.pc) process.exit(1);
          if (!c.deployment.githubPages.enabled) process.exit(1);
          if (c.deployment.cloudflare.enabled) process.exit(1);
          if (c.workflow.developmentBranch !== 'dev' || c.workflow.productionBranch !== 'prod') process.exit(1);
          NODE
