name: Verify Prototype

on:
  pull_request:
  push:
    branches: [main, dev, prod]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
