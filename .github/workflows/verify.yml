name: Verify Prototype

on:
  pull_request:
  push:
    branches: [main, dev, prod]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test Mira CLI
        shell: bash
        run: |
          printf 'Smoke Prototype\nmobile\ngithub\n' | node cli/mira.mjs create prototype mira-smoke --no-install
          test -f mira-smoke/apps/mobile/package.json
          test ! -d mira-smoke/apps/pc
          test -f mira-smoke/.github/workflows/deploy-github-pages.yml
          test ! -f mira-smoke/.github/workflows/deploy-cloudflare.yml
          node -e "const c=require('./mira-smoke/prototype.config.json'); if(!c.targets.mobile || c.targets.pc || !c.deployment.githubPages || c.deployment.cloudflare) process.exit(1)"
