name: Verify Prototype

on:
  pull_request:
  push:
    branches: [main, dev, prod]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Check version contract
        shell: bash
        run: |
          VERSION_FILE="$(tr -d '\r\n' < VERSION)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CONFIG_VERSION="$(node -p "require('./prototype.config.json').versioning.currentVersion")"
          test "$VERSION_FILE" = "$PACKAGE_VERSION"
          test "$VERSION_FILE" = "$CONFIG_VERSION"
      - run: npm run typecheck
      - run: npm run build
      - name: Check Mira CLI syntax
        run: node --check cli/mira.mjs
      - name: Smoke test Mira project generation
        shell: bash
        run: |
          node cli/mira.mjs create prototype mira-smoke --no-install --title="Smoke Prototype" --targets=mobile --deploy=github
          test -f mira-smoke/apps/mobile/package.json
          test ! -d mira-smoke/apps/pc
          test -f mira-smoke/.github/workflows/verify.yml
          test -f mira-smoke/.github/workflows/deploy-github-pages.yml
          test ! -f mira-smoke/.github/workflows/deploy-cloudflare.yml
          test -f mira-smoke/AGENTS.md
          test -f mira-smoke/docs/ai/skills.md
          test -f mira-smoke/docs/governance/version-control.md
          test "$(tr -d '\r\n' < mira-smoke/VERSION)" = "0.1.0"
          grep -q 'Status: `PENDING`' mira-smoke/docs/ai/skills.md
          ! grep -q 'cli/mira.mjs' mira-smoke/.github/workflows/verify.yml
          node - <<'NODE'
          const p = require('./mira-smoke/package.json');
          const c = require('./mira-smoke/prototype.config.json');
          if (p.version !== '0.1.0') process.exit(1);
          if (!p.author.includes('Tomz') || !p.author.includes('Mira')) process.exit(1);
          if (c.versioning.currentVersion !== '0.1.0') process.exit(1);
          if (c.versioning.seedVersion !== '0.2.0') process.exit(1);
          if (!c.targets.mobile || c.targets.pc) process.exit(1);
          if (!c.deployment.githubPages.enabled) process.exit(1);
          if (c.deployment.cloudflare.enabled) process.exit(1);
          if (c.workflow.developmentBranch !== 'dev' || c.workflow.productionBranch !== 'prod') process.exit(1);
          NODE
